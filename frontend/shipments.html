<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>(function(){var t=localStorage.getItem("sw_theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();
</script>
    <meta charset="UTF-8">
    <title>Shipments — Smart Warehouse</title>
    <link rel="stylesheet" href="css/design-system.css">
    <style>.track-steps{display:flex;align-items:center}
        .track-step{display:flex;flex-direction:column;align-items:center;flex:1}
        .track-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:grid;place-items:center;font-size:12px;position:relative;z-index:1;transition:all .2s}
        .track-dot--done{background:var(--success);border-color:var(--success);color:#fff}
        .track-dot--active{background:var(--brand-2);border-color:var(--brand-2);color:#fff;box-shadow:0 0 0 4px rgba(79,70,229,.15)}
        .track-label{font-size:10px;color:var(--text-faint);margin-top:6px;text-align:center;white-space:nowrap}
        .track-label--done{color:var(--success)}
        .track-label--active{color:var(--brand-2);font-weight:600}
        .track-connector{flex:1;height:2px;background:var(--border);margin-top:-28px}
        .track-connector--done{background:var(--success)}
        .drawer-back{position:fixed;inset:0;background:rgba(15,15,14,.4);z-index:50;display:none}
        .drawer{position:fixed;right:0;top:0;bottom:0;width:500px;background:var(--bg-elevated);border-left:1px solid var(--border);z-index:51;padding:24px;overflow-y:auto;display:none;box-shadow:-8px 0 24px rgba(0,0,0,.08)}
        .drawer.open,.drawer-back.open{display:block}
        @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand"><div class="brand-mark">SW</div><span>Smart Warehouse</span></div>
        <div class="nav-section">
            <div class="nav-section-title">Workspace</div>
            <a class="nav-item" href="dashboard.html"><span class="nav-icon">◐</span><span>Dashboard</span></a>
            <a class="nav-item" href="inventory.html"><span class="nav-icon">▦</span><span>Inventory</span></a>
            <a class="nav-item" href="products.html"><span class="nav-icon">▢</span><span>Products</span></a>
            <a class="nav-item" href="orders.html"><span class="nav-icon">⊟</span><span>Orders</span></a>
            <a class="nav-item nav-item--active" href="shipments.html"><span class="nav-icon">→</span><span>Shipments</span></a>
        </div>
        <div class="nav-section">
            <div class="nav-section-title">Network</div>
            <a class="nav-item" href="suppliers.html"><span class="nav-icon">◇</span><span>Suppliers</span></a>
        </div>
        <div class="nav-section">
            <div class="nav-section-title">Insights</div>
            <a class="nav-item" href="reports.html"><span class="nav-icon">◉</span><span>Reports</span></a>
        </div>
        <div class="user-card">
            <div class="user-avatar">HS</div>
            <div class="user-info"><div class="user-name">—</div><div class="user-role">—</div></div>
            <button class="btn btn--icon" onclick="logout()">⏻</button>
        </div>
    </aside>

    <div class="main">
        <header class="topbar">
            <div class="search"><span>⌕</span><input type="text" placeholder="Search tracking number…"><kbd>⌘K</kbd></div>
            <div class="row" style="gap:8px">
                <button class="btn btn--icon" style="position:relative">🔔<span class="notif-badge" style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none"></span></button>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme"><span class="theme-toggle-knob">🌙</span></button>
            </div>
        </header>

        <main class="content">
            <div class="page-header fade-up">
                <div><h1 class="page-title">Shipments</h1><p class="page-sub" id="shipSubtitle">Loading…</p></div>
                <div class="row" style="gap:8px">
                    <select id="filterStatus" style="height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--bg-elevated);color:var(--text);font-size:13px;font-family:var(--font-body)" onchange="loadShipments(1)">
                        <option value="">All Statuses</option>
                        <option value="PREPARED">Prepared</option>
                        <option value="PICKED_UP">Picked Up</option>
                        <option value="IN_TRANSIT">In Transit</option>
                        <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
                        <option value="DELIVERED">Delivered</option>
                    </select>
                </div>
            </div>

            <section class="card fade-up" style="animation-delay:.1s">
                <div class="table-wrap" style="border:0">
                    <table class="table">
                        <thead><tr><th>Tracking #</th><th>Order</th><th>Assigned To</th><th>Status</th><th>Shipped At</th><th>Delivered At</th><th></th></tr></thead>
                        <tbody id="shipBody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">Loading shipments…</td></tr></tbody>
                    </table>
                </div>
                <div class="row" style="padding:12px 16px;border-top:1px solid var(--divider)" id="shipPagination"></div>
            </section>
        </main>
    </div>
</div>

<div class="drawer-back" id="detailBack" onclick="closeDetail()"></div>
<aside class="drawer" id="detailDrawer">
    <div class="row" style="margin-bottom:20px">
        <div id="detailTitle"><span class="text-muted">Loading…</span></div>
        <div class="spacer"></div>
        <button class="btn btn--icon" onclick="closeDetail()">✕</button>
    </div>
    <div id="detailBody">Loading…</div>
</aside>

<script src="js/api.js"></script>
<script>if (!requireAuth()) throw new Error();
populateSidebarUser();

const STEPS = ["PREPARED","PICKED_UP","IN_TRANSIT","OUT_FOR_DELIVERY","DELIVERED"];
const STEP_LABELS = ["Prepared","Picked Up","In Transit","Out for Delivery","Delivered"];
const STEP_ICONS  = ["◎","↑","→","▦","★"];
const STATUS_MAP = { PREPARED:"badge--neutral",PICKED_UP:"badge--info",IN_TRANSIT:"badge--info",
                     OUT_FOR_DELIVERY:"badge--warning",DELIVERED:"badge--success",FAILED:"badge--danger",RETURNED:"badge--danger" };

function fmtTime(d) { return d ? new Date(d).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}) : "—"; }

async function loadShipments(page = 1) {
    const status = document.getElementById("filterStatus").value;
    const params = { page, per_page: 20 };
    if (status) params.status = status;

    const res = await API.shipments.list(params);
    if (!res?.ok) {
        document.getElementById("shipBody").innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--danger)">Failed to load.</td></tr>`;
        return;
    }
    const { data, pagination } = res.data;
    document.getElementById("shipSubtitle").textContent = `${pagination.total} shipments`;
    renderShipments(data);
    renderPagination(document.getElementById("shipPagination"), pagination, loadShipments);
}

function renderShipments(ships) {
    const tbody = document.getElementById("shipBody");
    if (!ships.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">No shipments found.</td></tr>`;
        return;
    }
    tbody.innerHTML = ships.map(s => `
      <tr style="cursor:pointer" onclick="openDetail(${s.id})">
        <td class="mono"><strong>${s.tracking_number||"—"}</strong></td>
        <td class="mono">${s.order_number||"—"}</td>
        <td>${s.employee_name||"Unassigned"}</td>
        <td><span class="badge ${STATUS_MAP[s.status]||"badge--neutral"}"><span class="badge-dot"></span>${s.status}</span></td>
        <td class="text-muted" style="font-size:12px">${fmtTime(s.shipped_at)}</td>
        <td class="text-muted" style="font-size:12px">${fmtTime(s.delivered_at)}</td>
        <td><button class="btn btn--ghost" style="font-size:12px">Track →</button></td>
      </tr>`).join("");
}

async function openDetail(id) {
    document.getElementById("detailDrawer").classList.add("open");
    document.getElementById("detailBack").classList.add("open");
    document.getElementById("detailBody").innerHTML = "Loading…";

    const res = await API.shipments.get(id);
    if (!res?.ok) { document.getElementById("detailBody").innerHTML = "Failed to load."; return; }
    const s = res.data.data;

    document.getElementById("detailTitle").innerHTML = `
      <span class="badge ${STATUS_MAP[s.status]||"badge--neutral"}"><span class="badge-dot"></span>${s.status}</span>
      <h2 style="font-family:var(--font-display);font-size:20px;font-weight:700;margin-top:8px">${s.tracking_number||"—"}</h2>
      <p class="text-muted" style="font-size:13px;margin-top:2px">Order: ${s.order_number||"—"}</p>`;

    const stepIdx = STEPS.indexOf(s.status);
    const stepsHtml = `<div class="track-steps" style="margin:20px 0">` +
        STEPS.map((step, i) => {
            const cls = i < stepIdx ? "--done" : i === stepIdx ? "--active" : "";
            const con = i < STEPS.length - 1
                ? `<div class="track-connector ${i < stepIdx ? "track-connector--done" : ""}"></div>` : "";
            return `<div class="track-step">
              <div class="track-dot track-dot${cls}">${i < stepIdx ? "✓" : STEP_ICONS[i]}</div>
              <div class="track-label track-label${cls}">${STEP_LABELS[i]}</div>
            </div>${con}`;
        }).join("") + `</div>`;

    const timeline = s.timeline || [];
    const timelineHtml = timeline.length
        ? `<div class="timeline">${timeline.map(t=>`
            <div class="timeline-item">
              <div class="timeline-dot timeline-dot--info"></div>
              <div class="timeline-time">${fmtTime(t.created_at)}</div>
              <div style="font-size:13px"><strong>${t.action}</strong>${t.description ? " — "+t.description : ""}</div>
            </div>`).join("")}</div>`
        : `<p class="text-muted" style="font-size:13px">No timeline entries.</p>`;

    const nextStatus = STEPS[stepIdx + 1];
    document.getElementById("detailBody").innerHTML = `
      ${stepsHtml}
      <div class="row" style="margin-bottom:16px;font-size:13px">
        <div><span class="text-muted">Employee: </span>${s.employee_name||"Unassigned"}</div>
        <div class="spacer"></div>
        <div><span class="text-muted">Destination: </span>${s.destination||"—"}</div>
      </div>
      <h3 style="font-family:var(--font-display);font-size:14px;font-weight:600;margin:0 0 10px">Timeline</h3>
      ${timelineHtml}
      ${nextStatus && s.status !== "DELIVERED" ? `
      <div style="margin-top:24px">
        <div class="field"><label>Update Notes</label><input type="text" id="statusNotes" placeholder="Optional notes…"></div>
        <div class="row" style="margin-top:12px">
          <div class="spacer"></div>
          <button class="btn btn--primary" id="updateBtn" onclick="updateStatus(${s.id},'${nextStatus}')">
            → Mark as ${nextStatus.replace(/_/g," ")}
          </button>
        </div>
      </div>` : ""}`;
}

async function updateStatus(id, newStatus) {
    const notes = document.getElementById("statusNotes")?.value || "";
    const btn   = document.getElementById("updateBtn");
    Loading.setButton(btn, true);
    const res = await API.shipments.status(id, newStatus, notes);
    Loading.setButton(btn, false, `→ Mark as ${newStatus.replace(/_/g," ")}`);
    if (res?.ok) {
        Toast.success(`Status updated to ${newStatus}`);
        closeDetail();
        loadShipments();
    }
}

function closeDetail() {
    document.getElementById("detailDrawer").classList.remove("open");
    document.getElementById("detailBack").classList.remove("open");
}

loadShipments();
</script>
</body>
</html>
